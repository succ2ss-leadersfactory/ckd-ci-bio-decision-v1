<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C1바이오 영업팀장 AI 리더십 Lab Journey</title>
  <style>
    #journey-root main > div > section.sticky,
    #journey-root main > div > section > div.mb-4.rounded-3xl.border.border-slate-200.bg-white.p-4.shadow-sm.md\:p-5:first-child,
    #journey-root main > div > header h1 + p {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="journey-root"></div>
  <script>
    window.__V40_VNEXT_PROTECTION_MARKERS = 'v40-vNext route only|journey-v39-preview.html 보호|src/journey-v39-app-preview.tsx 보호|팀장 역할 실습|업무관리 Lab 보강|상단 메타 UI 제거|역할과 팀원 구성 이해하기';
    window.addEventListener('DOMContentLoaded', function () {
      var title = 'C1바이오 영업팀장 AI 리더십 Lab Journey';
      var teamMembers = ['김재호 차장', '김문호 차장', '유희관 과장', '이대은 대리', '신재영 대리', '박재욱 사원', '문교원 사원'];
      var replacePairs = [
        ['우리 조', '여러분'],
        ['조별', '팀장 역할'],
        ['조가 ', '여러분이 '],
        ['조는 ', '여러분은 '],
        ['조의 ', '여러분의 '],
        ['조 이름', '실습 그룹'],
        ['조를 선택하세요', '실습 그룹을 선택하세요'],
        ['조/팀 선택', '실습 그룹/테이블 선택'],
        ['조 구성', '실습 방식'],
        ['조별 실습', '팀장 역할 실습'],
        ['조별 진행 코치', '팀장 역할 진행 코치']
      ];
      function replaceText(node) {
        if (!node || !node.nodeValue) return;
        var value = node.nodeValue;
        replacePairs.forEach(function (pair) { value = value.split(pair[0]).join(pair[1]); });
        if (node.nodeValue !== value) node.nodeValue = value;
      }
      function walkText(root) {
        if (!root) return;
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var node;
        while ((node = walker.nextNode())) replaceText(node);
      }
      function currentStepLabel() {
        var current = document.querySelector('[aria-current="step"]');
        return current ? current.textContent || '' : '';
      }
      function renderRoleIntroIfNeeded() {
        var label = currentStepLabel();
        var isRoleIntro = label.indexOf('2.') >= 0 && label.indexOf('역할과 팀원 구성') >= 0;
        var existing = document.getElementById('v40-role-team-intro-override');
        if (!isRoleIntro) {
          if (existing) existing.remove();
          return;
        }
        var host = document.querySelector('#journey-root main > div > section');
        if (!host) return;
        Array.prototype.slice.call(host.children).forEach(function (child) {
          if (child.id !== 'v40-role-team-intro-override' && child.tagName !== 'NAV') child.style.display = 'none';
        });
        if (existing) return;
        var panel = document.createElement('section');
        panel.id = 'v40-role-team-intro-override';
        panel.className = 'space-y-4';
        panel.innerHTML =
          '<section class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm md:p-5">' +
          '<p class="text-xs font-black uppercase tracking-wide text-cyan-700">2단계 · 역할과 팀원 구성 이해하기</p>' +
          '<h2 class="mt-2 text-2xl font-black text-slate-950">여러분은 오늘 C1바이오 영업팀장입니다</h2>' +
          '<p class="mt-2 text-sm leading-6 text-slate-600">실제 활동은 테이블 단위로 진행하지만, 판단의 기준은 모두 팀장 역할입니다. 여러분은 7명의 팀원을 이끄는 영업팀장으로서 성과관리, 업무관리, 사람관리를 차례로 판단합니다.</p>' +
          '</section>' +
          '<section class="grid gap-3 md:grid-cols-3">' +
          '<div class="rounded-3xl border border-cyan-100 bg-cyan-50 p-4"><p class="text-sm font-black text-cyan-950">여러분의 역할</p><p class="mt-2 text-sm leading-6 text-cyan-900">시장 변화와 전사전략을 팀 실행 기준으로 바꾸고, 팀원별 실행 신호를 읽어 2주 실행 메모를 완성하는 영업팀장입니다.</p></div>' +
          '<div class="rounded-3xl border border-emerald-100 bg-emerald-50 p-4"><p class="text-sm font-black text-emerald-950">오늘의 관리 흐름</p><p class="mt-2 text-sm leading-6 text-emerald-900">성과관리에서 기준을 세우고, 업무관리에서 실행 과제로 바꾸며, 사람관리에서 1on1 대화와 행동 합의를 준비합니다.</p></div>' +
          '<div class="rounded-3xl border border-amber-100 bg-amber-50 p-4"><p class="text-sm font-black text-amber-950">판단 원칙</p><p class="mt-2 text-sm leading-6 text-amber-900">AI는 답을 대신 정하지 않습니다. 여러분이 먼저 판단하고, AI 초안은 비교·수정·보완하는 재료로만 사용합니다.</p></div>' +
          '</section>' +
          '<section class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm md:p-5"><h3 class="text-lg font-black text-slate-950">가상 팀원 7명</h3><div class="mt-3 grid gap-2 md:grid-cols-4">' +
          teamMembers.map(function (name) { return '<div class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-black text-slate-700">' + name + '</div>'; }).join('') +
          '</div><p class="mt-3 text-xs font-bold leading-5 text-slate-500">이 인물들은 실제 사람이 아니라 교육용 가상 팀원입니다. 이후 단계에서 여러분은 이 팀원들의 실행 신호, 업무 흐름, 1on1 대화 초점을 판단합니다.</p></section>';
        host.prepend(panel);
      }
      function apply() {
        var h1 = document.querySelector('#journey-root main > div > header h1');
        if (h1 && h1.textContent !== title) h1.textContent = title;
        walkText(document.getElementById('journey-root'));
        renderRoleIntroIfNeeded();
      }
      apply();
      new MutationObserver(apply).observe(document.getElementById('journey-root'), { childList: true, subtree: true, characterData: true });
    });
  </script>
  <script type="module" src="/src/journey-v40-vnext-app-preview.tsx"></script>
</body>
</html>
