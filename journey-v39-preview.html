<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C1바이오 영업팀장 AI 리더십 Lab Journey</title>
</head>
<body>
  <div id="journey-root"></div>
  <script>
    window.__normalizeV39ActionPaste = function normalizeV39ActionPaste(text) {
      const actionNumbers = {
        '①': '1', '②': '2', '③': '3', '④': '4', '⑤': '5',
        '⑥': '6', '⑦': '7', '⑧': '8', '⑨': '9', '⑩': '10',
        '⑪': '11', '⑫': '12', '⑬': '13', '⑭': '14', '⑮': '15',
        '⑯': '16', '⑰': '17', '⑱': '18', '⑲': '19', '⑳': '20'
      };
      const detailLabels = /^(\s*[-*•]?\s*)?(확인할 기록|확인 기록|확인 자료|근거 자료|참고 기록|참고 자료|사용 자료|검토 자료|팀원 질문|팀원에게 확인할 질문|확인 질문|남길 산출물|산출물|결과물|정리 결과|남길 결과|실행 시점|시점|타이밍|언제|주의할 점|주의점|확인 기준|보완 사항|남길 메모|메모)\s*[:：]\s*$/;
      const detailLineLabels = /^(\s*[-*•]?\s*)?(확인할 기록|확인 기록|확인 자료|근거 자료|참고 기록|참고 자료|사용 자료|검토 자료|팀원 질문|팀원에게 확인할 질문|확인 질문|남길 산출물|산출물|결과물|정리 결과|남길 결과|실행 시점|시점|타이밍|언제|주의할 점|주의점|확인 기준|보완 사항|남길 메모|메모)\s*[:：]/;
      const actionStart = /^\s*#{0,6}\s*(행동|실행|실행안|실행 행동|액션|Action|Step)\s*(\d+|[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳])/i;
      const sectionStart = /^\s*#{1,6}\s*(\d+[.)]\s*)?(고객군 후보|확인된 단서|아직 부족한 정보|이번 2주 행동|팀원에게 확인할 질문|표현·자료 안전선|다음 회의에서 확인할 것)/;

      function normalizeGeminiCustomerHeadings(value) {
        return value
          .replace(/^(\s*#{1,6}\s*)고객군\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s+/gm, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)대상\s*고객군\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s+/gm, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)고객\s*세그먼트\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s+/gm, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)세그먼트\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s+/gm, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)대응군\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s+/gm, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)점검\s*조건\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s+/gm, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)고객군\s*\/\s*조건\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s+/gm, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)(?:Group|Segment|Customer Group|Case)\s+([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+|[A-F])\s*[:：.-]?\s+/gim, '$1고객군/점검 조건 $2 ')
          .replace(/^(\s*#{1,6}\s*)([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+)[.)]\s+([^\n#]*고객군[^\n]*)$/gm, '$1고객군/점검 조건 $2 $3')
          .replace(/^(\s*#{1,6}\s*)([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|\d+)[.)]\s+([^\n#]*점검\s*조건[^\n]*)$/gm, '$1고객군/점검 조건 $2 $3');
      }

      function normalizeActionLabels(value) {
        return value
          .replace(/(행동|실행|실행안|실행 행동|액션)\s*([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳])\s*/g, function (_match, label, marker) {
            return '행동 ' + actionNumbers[marker] + '. ';
          })
          .replace(/(?:Action|Step)\s*([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳])\s*/gi, function (_match, marker) {
            return '행동 ' + actionNumbers[marker] + '. ';
          })
          .replace(/(행동|실행|실행안|실행 행동|액션)\s*(\d+)\s*[:：)]\s*/g, '행동 $2. ')
          .replace(/(?:Action|Step)\s*(\d+)\s*[:：).]\s*/gi, '행동 $1. ');
      }

      function normalizeDetailLabel(label) {
        if (/^(확인 자료|근거 자료|참고 기록|참고 자료|사용 자료|검토 자료)$/.test(label)) return '확인할 기록';
        if (/^(결과물|정리 결과|남길 결과)$/.test(label)) return '남길 산출물';
        if (/^(시점|타이밍|언제)$/.test(label)) return '실행 시점';
        if (/^(확인 질문)$/.test(label)) return '팀원 질문';
        return label;
      }

      function safeDetailLabel(label) {
        const normalized = normalizeDetailLabel(label);
        if (normalized === '팀원 질문' || normalized === '팀원에게 확인할 질문') return '보완 사항';
        return normalized;
      }

      function safeDetailValue(label, values) {
        const normalized = normalizeDetailLabel(label);
        if (normalized === '팀원 질문' || normalized === '팀원에게 확인할 질문') return '팀원 질문 - ' + values.join(', ');
        return values.join(', ');
      }

      function collapseNestedDetailBullets(value) {
        const lines = value.split(/\r?\n/);
        const output = [];

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          const detailMatch = line.match(detailLabels);

          if (!detailMatch) {
            output.push(line);
            continue;
          }

          const label = detailMatch[2];
          const values = [];
          let cursor = index + 1;

          while (cursor < lines.length) {
            const nextLine = lines[cursor];

            if (/^\s*$/.test(nextLine)) {
              cursor += 1;
              continue;
            }
            if (detailLineLabels.test(nextLine) || actionStart.test(nextLine) || sectionStart.test(nextLine) || /^\s*---+\s*$/.test(nextLine)) {
              break;
            }

            const bulletMatch = nextLine.match(/^\s*[-*•]\s+(.+?)\s*$/);
            if (bulletMatch) {
              values.push(bulletMatch[1].trim());
              cursor += 1;
              continue;
            }

            if (/^\s{2,}\S/.test(nextLine)) {
              values.push(nextLine.trim());
              cursor += 1;
              continue;
            }

            break;
          }

          if (values.length > 0) {
            output.push(safeDetailLabel(label) + ': ' + safeDetailValue(label, values));
            index = cursor - 1;
          } else {
            output.push(line);
          }
        }

        return output.join('\n');
      }

      return collapseNestedDetailBullets(normalizeActionLabels(normalizeGeminiCustomerHeadings(text)));
    };

    document.addEventListener('paste', function (event) {
      const target = event.target;
      if (!(target instanceof HTMLTextAreaElement)) return;
      const pastedText = event.clipboardData && event.clipboardData.getData('text/plain');
      if (!pastedText) return;
      const normalizedText = window.__normalizeV39ActionPaste(pastedText);
      if (normalizedText === pastedText) return;

      event.preventDefault();
      const start = target.selectionStart || 0;
      const end = target.selectionEnd || 0;
      target.setRangeText(normalizedText, start, end, 'end');
      target.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertFromPaste', data: normalizedText }));
    }, true);
  </script>
  <script type="module" src="/src/journey-v39-app-preview.tsx"></script>
</body>
</html>
