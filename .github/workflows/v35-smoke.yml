name: v35 Smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  smoke-v35:
    name: Run v35 smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run v35 static smoke check
        run: npm run smoke:v35:static

      - name: Run v35 scoped TypeScript check
        run: npm run typecheck:v35

      - name: Build Vite app
        run: npm run build

      - name: Run v35 dist smoke check
        run: npm run smoke:v35:dist

      - name: Run v35 cutover preflight guard
        run: npm run preflight:v35:cutover

      - name: Run integrated v35 smoke check
        run: npm run smoke:v35

      - name: Write v35 smoke summary
        if: always()
        run: |
          {
            echo "# v35 Smoke Summary"
            echo ""
            echo "## Commands covered"
            echo ""
            echo "- npm install"
            echo "- npm run smoke:v35:static"
            echo "- npm run typecheck:v35"
            echo "- npm run build"
            echo "- npm run smoke:v35:dist"
            echo "- npm run preflight:v35:cutover"
            echo "- npm run smoke:v35"
            echo ""
            echo "## Protected validation entry points"
            echo ""
            echo "- README.md keeps the v35 validation entry point"
            echo "- docs/v35-validation-index.md keeps the document sequence"
            echo "- docs/v35-browser-qa-runbook.md keeps the browser QA procedure"
            echo "- docs/v35-browser-qa-console-snippet.md keeps the storage/key evidence check"
            echo "- docs/v35-browser-qa-result.md keeps the required browser QA result fields"
            echo ""
            echo "## Why typecheck is scoped"
            echo ""
            echo "The repository contains older archived journey files such as v26-v34. Some of those files still have historical TypeScript errors, so this smoke workflow checks the v35 preview dependency graph with tsconfig.v35-smoke.json while preserving v34 source files unchanged."
            echo ""
            echo "## Next required checks"
            echo ""
            echo "1. Open README.md and start from docs/v35-validation-index.md."
            echo "2. Run **v35 Remote Smoke** after Vercel deployment completes."
            echo "3. Follow docs/v35-browser-qa-runbook.md for browser QA."
            echo "4. Open /journey.html and confirm the v34 operating screen still works."
            echo "5. Open /journey-v35-preview.html and run Step 0-8 browser QA."
            echo "6. Run the console snippet and confirm missingPreviewKeys none, missingSavedStateKeys none, pass true."
            echo "7. Record actual results in docs/v35-browser-qa-result.md and docs/v35-preview-smoke-result.md."
            echo "8. Run **v35 Readiness Audit** only after real QA results are recorded."
            echo ""
            echo "## Cutover status"
            echo ""
            echo "Cutover remains blocked until smoke, remote smoke, browser QA, storage key separation, console snippet evidence, and readiness audit all pass."
          } >> "$GITHUB_STEP_SUMMARY"
