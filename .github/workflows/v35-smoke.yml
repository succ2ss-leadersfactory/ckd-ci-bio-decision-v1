name: v35 Smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  smoke-v35:
    name: Run v35 smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run v35 static smoke check
        run: npm run smoke:v35:static

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build Vite app
        run: npm run build

      - name: Run v35 dist smoke check
        run: npm run smoke:v35:dist

      - name: Run v35 cutover preflight guard
        run: npm run preflight:v35:cutover

      - name: Run integrated v35 smoke check
        run: npm run smoke:v35
