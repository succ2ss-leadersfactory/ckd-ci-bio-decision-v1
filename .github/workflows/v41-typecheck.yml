name: v41 Typecheck

on:
  pull_request:
    paths:
      - 'package.json'
      - 'tsconfig.v41-smoke.json'
      - 'src/journey-shell.tsx'
      - 'src/journey-storage.ts'
      - 'src/journey-v41-*.ts'
      - 'src/journey-v41-*.tsx'
      - '.github/workflows/v41-typecheck.yml'
  workflow_dispatch:

jobs:
  typecheck-v41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:v41
