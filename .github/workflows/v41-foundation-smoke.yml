name: v41 Foundation Smoke

on:
  pull_request:
    paths:
      - 'journey-v41-preview.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'scripts/smoke-v41-foundation.mjs'
      - 'scripts/smoke-v41-mount-guard.mjs'
      - 'src/journey-shell.tsx'
      - 'src/journey-storage.ts'
      - 'src/journey-v41-*.ts'
      - 'src/journey-v41-*.tsx'
      - '.github/workflows/v41-foundation-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-v41-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run smoke:v41:foundation
