name: v41 Smoke

on:
  push:
    branches:
      - main
      - master
      - feature/v37-preview-shell
    paths:
      - 'journey-v41-preview.html'
      - 'src/journey-v41-*.tsx'
      - 'src/journey-v41-*.ts'
      - 'src/journey-v41-*.css'
      - 'scripts/smoke-v41-static.mjs'
      - 'docs/v41-browser-qa-checklist.md'
      - 'docs/v41-manual-qa-checklist.md'
      - 'docs/v41-manual-qa-run-log.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.v41-smoke.json'
      - 'vite.config.ts'
      - '.github/workflows/v41-smoke.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'journey-v41-preview.html'
      - 'src/journey-v41-*.tsx'
      - 'src/journey-v41-*.ts'
      - 'src/journey-v41-*.css'
      - 'scripts/smoke-v41-static.mjs'
      - 'docs/v41-browser-qa-checklist.md'
      - 'docs/v41-manual-qa-checklist.md'
      - 'docs/v41-manual-qa-run-log.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.v41-smoke.json'
      - 'vite.config.ts'
      - '.github/workflows/v41-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-v41:
    name: Run v41 smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run v41 static smoke check
        run: npm run smoke:v41:static

      - name: Run v41 typecheck
        run: npm run typecheck:v41

      - name: Run v41 build check
        run: npm run build

      - name: Write v41 smoke summary
        if: always()
        run: |
          {
            echo "# v41 Smoke Summary"
            echo ""
            echo "## Commands covered"
            echo ""
            echo "- npm install"
            echo "- npm run smoke:v41:static"
            echo "- npm run typecheck:v41"
            echo "- npm run build"
            echo ""
            echo "## Protected route policy"
            echo ""
            echo "- /journey.html remains protected."
            echo "- /journey-v39-preview.html remains protected."
            echo "- /ckd-ai-lab.html remains the existing v40-vNext pilot entry."
            echo "- /journey-v40-vnext-preview.html remains protected."
            echo "- /journey-v41-preview.html is the isolated v41 preview lane."
            echo ""
            echo "## v41 scope"
            echo ""
            echo "- 10-screen v41 preview flow"
            echo "- Step 5 team criteria selection"
            echo "- Step 6 execution planning and execution cycle"
            echo "- Step 7 decision-led task instruction"
            echo "- Step 8 task boundary and bottleneck response"
            echo "- Step 9 v40-vNext people-management target selection parity"
            echo "- Step 10 v40-vNext 1on1 practice parity"
            echo "- v41 manual QA checklist and run log marker guard"
            echo ""
            echo "## Next required checks"
            echo ""
            echo "1. Open /journey-v41-preview.html in the browser."
            echo "2. Confirm Step 1 gate."
            echo "3. Complete Step 5 to Step 10 data-flow QA."
            echo "4. Confirm Step 9/10 people-management flow follows v40-vNext parity."
            echo "5. Confirm /ckd-ai-lab.html and /journey-v40-vnext-preview.html are unchanged."
            echo "6. Record actual browser QA results in docs/v41-manual-qa-run-log.md."
          } >> "$GITHUB_STEP_SUMMARY"
